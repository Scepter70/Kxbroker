<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin — Kxbroker</title>
  <meta name="description" content="Admin area for Kxbroker">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header style="padding:16px;background:#04263b;color:#1fb6ff;">
    <a href="/" style="color:#1fb6ff;text-decoration:none;font-weight:600;">← Back to site</a>
  </header>

  <main style="padding:24px;">
    <h1>Admin Area</h1>
    <p>This is a minimal admin page. Only users with role = <code>admin</code> should use this page.</p>

    <section style="margin-top:16px;">
      <button id="signOutBtn" style="padding:10px 16px;background:#1fb6ff;border:none;border-radius:6px;color:#04263b;">Sign out</button>
    </section>

    <section id="adminContent" style="margin-top:24px;">
      <h2>Admin tools</h2>
      <p>Add admin-only tools and UI here (user management, reports, settings).</p>
    </section>
  </main>

  <script type="module" src="/script.js" defer></script>
  <script>
    // Hook sign-out to the shared script.js signOut() helper if it exists
    document.getElementById('signOutBtn').addEventListener('click', () => {
      if (typeof signOut === 'function') {
        signOut()
      } else {
        // fallback
        window.location.href = '/'
      }
    })
  </script>
</body>
</html>
